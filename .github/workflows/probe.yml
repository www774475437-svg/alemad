name: Probe pages
on:
  push:
    paths: ['tool/probe.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out; i=0
          while read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1))
            curl -sL -m 40 -A "Mozilla/5.0" -D "out/$i.headers" -o "out/$i.html" "$u" || echo "fail $u"
            echo "$i $u $(wc -c < out/$i.html)" >> out/index.txt
          done < tool/probe.txt
          cd out && git init -q -b probe && git add -A
          git -c user.name=www774475437-svg -c user.email=338496743+www774475437-svg@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
